<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta
      name="description"
      content="Nienburg – ein gemütlicher, rundenbasierter Mittelalter-Städtebauer."
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <title>Nienburg</title>
  </head>
  <body>
    <header class="topbar">
      <div class="titlebar">
        <h1>Nienburg</h1>
        <p id="date" class="date"></p>
        <span class="spacer"></span>
        <button id="new" type="button" class="quiet"></button>
        <button id="undo" type="button"></button>
        <button id="end" type="button" class="primary"></button>
      </div>
      <div id="resources" class="chips"></div>
    </header>
    <main>
      <canvas id="map"></canvas>
      <aside id="info" class="info" aria-live="polite"></aside>
    </main>
    <footer class="toolbar">
      <p id="hint" class="hint"></p>
      <div id="tools" class="tools" role="toolbar"></div>
    </footer>
    <dialog id="report" class="report"></dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
