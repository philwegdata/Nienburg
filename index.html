<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta
      name="description"
      content="Nienburg – ein gemütlicher, rundenbasierter Mittelalter-Städtebauer."
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <title>Nienburg</title>
  </head>
  <body>
    <header class="topbar">
      <div class="titlebar">
        <button id="menu" type="button" class="menu"></button>
        <p id="date" class="date"></p>
        <span class="spacer"></span>
        <button id="undo" type="button"></button>
        <button id="end" type="button" class="primary"></button>
      </div>
      <div id="resources" class="chips"></div>
    </header>
    <main>
      <canvas id="map"></canvas>
      <aside id="info" class="info" aria-live="polite"></aside>
    </main>
    <footer class="toolbar">
      <div class="hintrow">
        <p id="hint" class="hint"></p>
        <label class="view"
          ><span id="viewLabel"></span>
          <select id="view"></select
        ></label>
      </div>
      <div id="tabs" class="tools tabs" role="toolbar"></div>
      <div id="tools" class="tools" role="toolbar"></div>
    </footer>
    <dialog id="report" class="sheet"></dialog>
    <dialog id="goals" class="sheet"></dialog>
    <dialog id="cities" class="sheet wide"></dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
